  <div class="col-lg-5 col-md-6 col-12">

    <div class="card p-4 shadow-sm h-100">
      <h4 class="fw-bold mb-3">Contact Form</h4>
      <form>
        <div class="mb-3">
          <label class="form-label">Full Names</label>
          <input type="text" class="form-control" placeholder="Enter full names" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="Enter your email address" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" placeholder="Subject" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </div>
